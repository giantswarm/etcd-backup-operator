{{- if .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
  name: {{ include "resource.default.name" . }}-exceptions
  namespace: kube-system
spec:
  policyRefs:
  - name: disallow-host-namespaces
    kind: ValidatingPolicy
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  # check-resources-request-and-limits-ratio is a supplemental policy and
  # usually not enabled. It is excepted because the etcd-backup-operator
  # Deployment fails it when the policy is enforced.
  - name: check-resources-request-and-limits-ratio
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the etcd-backup-operator Deployment fails it when the
  # policy is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the etcd-backup-operator ServiceAccount
  # fails it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: etcd-backup-operator-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ include "resource.default.namespace" . }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ include "resource.default.name" . }}' || object.metadata.name.startsWith('{{ include "resource.default.name" . }}-'))
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
  name: {{ include "resource.default.name" . }}-scheduler-exceptions
  namespace: kube-system
spec:
  policyRefs:
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the etcd-backup-operator scheduler
  # CronJobs fail it when the policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the etcd-backup-operator scheduler CronJobs fail it when
  # the policy is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # require-pod-probes is a supplemental policy and usually not enabled. It is
  # excepted because the Pods of the etcd-backup-operator scheduler Jobs fail
  # it when the policy is enforced.
  - name: require-pod-probes
    kind: ValidatingPolicy
  matchConditions:
  - name: etcd-backup-operator-scheduler-workloads
    expression: >-
      request.kind.kind in ['CronJob', 'Job', 'Pod'] &&
      request.namespace == '{{ include "resource.default.namespace" . }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ include "resource.default.name" . }}-scheduler' || object.metadata.name.startsWith('{{ include "resource.default.name" . }}-scheduler-'))
{{- end }}
